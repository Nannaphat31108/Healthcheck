# Render Blueprint: web app (Node) + PostgreSQL
# Dashboard → New → Blueprint → choose this repo
services:
  - type: web
    name: dulae-arom-kru
    runtime: node
    plan: free            # เปลี่ยนเป็น starter เพื่อไม่ให้เว็บหลับเมื่อใช้งานจริง
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: dulae-db
          property: connectionString
      - key: ADMIN_USERNAME   # ชื่อผู้ใช้แอดมิน (กรอกตอนสร้าง Blueprint)
        sync: false
      - key: ADMIN_PASSWORD   # รหัสผ่านแอดมิน อย่างน้อย 8 ตัวอักษร
        sync: false
      - key: REGISTER_CODE    # รหัสลงทะเบียนสำหรับครู (เว้นว่าง = ใครก็สมัครได้)
        sync: false

databases:
  - name: dulae-db
    databaseName: dulae
    user: dulae
    plan: free              # ฟรีหมดอายุ ~30 วัน — ใช้เก็บข้อมูลวิจัยจริงควรอัปเกรดแผน
